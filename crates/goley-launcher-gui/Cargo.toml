[package]
name = "goley-launcher-gui"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "goley-launcher"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
] }

[build-dependencies]
winres = "0.1"
