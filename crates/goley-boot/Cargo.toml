[package]
name = "goley-boot"
version.workspace = true
edition.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "goley-boot"
path = "src/main.rs"
test = false
bench = false

[dependencies]
anyhow.workspace = true
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing.workspace = true
tracing-subscriber.workspace = true
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

# The official Windows bindings necessarily expose unsafe FFI. Unsafe code is
# confined to src/windows_process.rs and reviewed at every call boundary.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
